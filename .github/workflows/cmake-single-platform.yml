name: CMake on a single platform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    # Login shell so the activated conda environment is available in every `run` step.
    defaults:
      run:
        shell: bash -el {0}

    steps:
    - uses: actions/checkout@v4

    - name: Create conda environment
      uses: conda-incubator/setup-miniconda@v3
      with:
        environment-file: conda/lnot-env.yaml
        activate-environment: lnot-env
        miniforge-version: latest
        channels: conda-forge
        conda-remove-defaults: true
        # Caches the downloaded packages between runs
        use-only-tar-bz2: false

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DLNOT_BUILD_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}
      
    - name: Lint
      # Runs the hooks configured in .pre-commit-config.yaml (formatting, etc.)
      run: pre-commit run --all-files --show-diff-on-failure

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure
